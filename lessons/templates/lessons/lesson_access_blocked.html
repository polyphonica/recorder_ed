{% extends 'base.html' %}

{% block title %}Payment Required{% endblock %}

{% block content %}
<div class="container mx-auto max-w-lg py-16 px-4">
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body text-center">
            <div class="text-6xl mb-4">💳</div>
            <h2 class="card-title justify-center text-2xl mb-2">Payment Required</h2>
            <p class="text-base-content/70 text-lg mb-6">{{ message }}</p>
            <div class="card-actions justify-center gap-3">
                <form method="post" action="{% url 'private_teaching:add_to_cart' lesson.id %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-shopping-cart mr-2"></i>Add to Cart & Pay
                    </button>
                </form>
                <a href="{% url 'private_teaching:student_dashboard' %}" class="btn btn-ghost">
                    Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
